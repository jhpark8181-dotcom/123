<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>박정희 모바일 명함</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Malgun Gothic',sans-serif;
    background:#f4f7fb;
    color:#0A2E6D;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}
.card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:24px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
}
.name{
    font-size:2.2rem;
    font-weight:700;
    margin-bottom:12px;
}
.intro{
    font-size:1.1rem;
    line-height:1.7;
    margin-bottom:30px;
}
.section-title{
    font-size:1.4rem;
    font-weight:700;
    margin-bottom:20px;
}
.work-list{
    list-style:none;
}
.work-list li{
    background:#eef4ff;
    margin:12px 0;
    padding:16px;
    border-radius:14px;
    font-size:1.1rem;
    font-weight:600;
}
.contact-btn{
    display:inline-block;
    margin-top:35px;
    padding:16px 40px;
    background:#0A2E6D;
    color:#fff;
    text-decoration:none;
    font-size:1.2rem;
    font-weight:700;
    border-radius:50px;
    transition:.3s;
}
.contact-btn:hover{
    transform:translateY(-2px);
    opacity:.9;
}
</style>
</head>
<body>
<div class="card">
    <div class="name">박정희</div>
    <div class="intro">
        월드인재개발원을 운영하며<br>
        서비스 교육과 코칭을 제공하고 있습니다.
    </div>

    <div class="section-title">주요 활동</div>

    <ul class="work-list">
        <li>숭실대학교 경영학부 겸임교수</li>
        <li>월드인재개발원 대표</li>
        <li>서비스 교육 및 코칭 전문가</li>
    </ul>

    <a href="tel:010-0000-0000" class="contact-btn">상담 문의</a>
</div>

<script>
document.querySelector('.contact-btn').addEventListener('click',function(){
    alert('상담 문의를 환영합니다.');
});
</script>
</body>
</html>
